<!DOCTYPE html>
<html>
<head>
    <title>Recommendations</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<h2 class="title" color="white">Recommended For You</h2>

<div class="products">

{% for item in results %}
<div class="card">

    <img
        src="{{ item.img_link if item.img_link else 'https://via.placeholder.com/200?text=No+Image' }}"
        alt="{{ item.product_name }}"
        loading="lazy"
        onerror="handleImageError(this)"
    >

    <h3>{{ item.product_name }}</h3>

    <p class="rating">⭐ {{ item.rating }}</p>

    <p class="price"> {{ item.discounted_price }}</p>

    <button>Add to Cart</button>

</div>
{% endfor %}

</div>

<div class="back">
    <a href="/">⬅ Go Back</a>
</div>

<script>
function handleImageError(img) {
    if (img.dataset.fallbackApplied === "true") {
        return;
    }

    img.dataset.fallbackApplied = "true";
    img.src = "../static/images/image-not-available.png";
    img.alt = "Image unavailable";
}
</script>

</body>
</html>
